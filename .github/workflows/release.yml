name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Package & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned so the rebuilt bundle is byte-identical to the committed one.
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Assert tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(jq -r .version package.json)"
          echo "Tag version:  $TAG"
          echo "package.json: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Bump package.json or retag."
            exit 1
          fi

      - name: Assert committed dist/ is up to date
        run: |
          bun run build
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is stale. Run 'bun run build' and commit the result before tagging."
            git --no-pager diff --stat -- dist
            exit 1
          fi

      - name: Package plugin archive
        run: |
          PKG="fencepost-${GITHUB_REF_NAME}"
          mkdir "$PKG"
          cp -r .claude-plugin hooks skills presets dist README.md LICENSE "$PKG/"
          zip -r "$PKG.zip" "$PKG"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: fencepost-${{ github.ref_name }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
