name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    name: Verify tag matches version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert tag == package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(jq -r .version package.json)"
          echo "Tag version:     $TAG"
          echo "package.json:    $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Bump package.json or retag."
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            name: linux-x64
            bin: fencepost
            archive: tar.gz
          - target: bun-linux-arm64
            name: linux-arm64
            bin: fencepost
            archive: tar.gz
          - target: bun-darwin-x64
            name: darwin-x64
            bin: fencepost
            archive: tar.gz
          - target: bun-darwin-arm64
            name: darwin-arm64
            bin: fencepost
            archive: tar.gz
          - target: bun-windows-x64
            name: windows-x64
            bin: fencepost.exe
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cross-compile binary
        run: |
          bun build --compile --target=${{ matrix.target }} \
            src/index.ts --outfile "${{ matrix.bin }}"

      # Assemble a ready-to-install plugin directory: the platform binary plus
      # the manifest, hooks, skills, and bundled presets it needs at runtime.
      - name: Assemble plugin
        run: |
          PKG="fencepost-${{ matrix.name }}"
          mkdir -p "$PKG/bin"
          cp "${{ matrix.bin }}" "$PKG/bin/${{ matrix.bin }}"
          cp -r .claude-plugin hooks skills presets "$PKG/"
          cp README.md LICENSE "$PKG/"

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: tar -czf "fencepost-${{ matrix.name }}.tar.gz" "fencepost-${{ matrix.name }}"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        run: zip -r "fencepost-${{ matrix.name }}.zip" "fencepost-${{ matrix.name }}"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: fencepost-${{ matrix.name }}.${{ matrix.archive }}
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
