name: Scanner compatibility

# Verifies the secret-scanner adapters against multiple versions of each
# supported scanner, so the version-compatibility claims in the docs stay true.
#
# Versions are resolved LIVE (not hard-coded): the `setup` job queries each
# scanner's release feed for the latest 4 releases (the current release plus the
# three before it, i.e. the N-3 support window) and appends the documented
# minimum-supported floor. The weekly cron therefore genuinely picks up new
# releases and fails if one breaks an adapter.
on:
  push:
    branches: [main]
    paths:
      - "src/secrets/**"
      - "test/secrets/**"
      - "scripts/scanner-bench.ts"
      - "scripts/scanner-ordering-check.ts"
      - "scripts/sync-secrets-docs.ts"
      - "scanner-floors.json"
      - "docs/docs/configuration/secrets.md"
      - ".github/workflows/scanner-compat.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/secrets/**"
      - "test/secrets/**"
      - "scripts/scanner-bench.ts"
      - "scripts/scanner-ordering-check.ts"
      - "scripts/sync-secrets-docs.ts"
      - "scanner-floors.json"
      - "docs/docs/configuration/secrets.md"
      - ".github/workflows/scanner-compat.yml"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  setup:
    name: Resolve scanner versions
    runs-on: ubuntu-latest
    outputs:
      gitleaks: ${{ steps.resolve.outputs.gitleaks }}
      betterleaks: ${{ steps.resolve.outputs.betterleaks }}
      trufflehog: ${{ steps.resolve.outputs.trufflehog }}
      detect_secrets: ${{ steps.resolve.outputs.detect_secrets }}
    steps:
      - uses: actions/checkout@v6
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Repo / asset / floor all come from scanner-floors.json, the single
          # source of truth shared with the docs (scripts/sync-secrets-docs.ts).
          floors=scanner-floors.json
          f() { jq -r ".scanners[\"$1\"].$2" "$floors"; }
          # Latest 4 stable GitHub releases that actually ship the expected
          # Linux asset (a tag can exist with no/incomplete assets), + a floor.
          # Args: repo, asset-name-substring, floor.
          gh_latest() {
            gh api "repos/$1/releases" \
              | jq -c --arg pat "$2" --arg f "$3" \
                  '[.[] | select(.prerelease==false and .draft==false)
                        | select(any(.assets[].name; contains($pat)))
                        | (.tag_name | ltrimstr("v"))]
                   | .[0:4] | (if index($f) then . else . + [$f] end)'
          }
          # Latest 4 stable PyPI releases + a floor.
          ds_latest() {
            curl -fsSL https://pypi.org/pypi/detect-secrets/json \
              | jq -r '.releases | keys[]' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 4 \
              | jq -R . | jq -sc --arg f "$1" 'if index($f) then . else . + [$f] end'
          }
          # Assign first so `set -e` aborts on a failed API call instead of
          # silently emitting an empty matrix (which would skip the job).
          gl=$(gh_latest "$(f gitleaks repo)" "$(f gitleaks asset)" "$(f gitleaks floor)")
          bl=$(gh_latest "$(f betterleaks repo)" "$(f betterleaks asset)" "$(f betterleaks floor)")
          th=$(gh_latest "$(f trufflehog repo)" "$(f trufflehog asset)" "$(f trufflehog floor)")
          ds=$(ds_latest "$(f detect-secrets floor)")
          for v in "$gl" "$bl" "$th" "$ds"; do
            case "$v" in \[*\]) ;; *) echo "version resolution failed: '$v'" >&2; exit 1 ;; esac
          done
          {
            echo "gitleaks=$gl"
            echo "betterleaks=$bl"
            echo "trufflehog=$th"
            echo "detect_secrets=$ds"
          } | tee -a "$GITHUB_OUTPUT"

  gitleaks:
    name: gitleaks ${{ matrix.version }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.gitleaks) }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - name: Install gitleaks ${{ matrix.version }}
        run: |
          curl -fsSL -o gl.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${{ matrix.version }}/gitleaks_${{ matrix.version }}_linux_x64.tar.gz"
          tar xzf gl.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - run: bun test test/secrets/

  betterleaks:
    name: betterleaks ${{ matrix.version }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.betterleaks) }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - name: Install betterleaks ${{ matrix.version }}
        run: |
          curl -fsSL -o bl.tar.gz \
            "https://github.com/betterleaks/betterleaks/releases/download/v${{ matrix.version }}/betterleaks_${{ matrix.version }}_linux_x64.tar.gz"
          tar xzf bl.tar.gz betterleaks
          sudo install betterleaks /usr/local/bin/betterleaks
          betterleaks version
      - run: bun test test/secrets/

  trufflehog:
    name: trufflehog ${{ matrix.version }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.trufflehog) }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - name: Install trufflehog ${{ matrix.version }}
        run: |
          curl -fsSL -o th.tar.gz \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${{ matrix.version }}/trufflehog_${{ matrix.version }}_linux_amd64.tar.gz"
          tar xzf th.tar.gz trufflehog
          sudo install trufflehog /usr/local/bin/trufflehog
          trufflehog --version
      - run: bun test test/secrets/

  detect-secrets:
    name: detect-secrets ${{ matrix.version }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.detect_secrets) }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install detect-secrets ${{ matrix.version }}
        run: |
          pipx install "detect-secrets==${{ matrix.version }}"
          detect-secrets --version
      - run: bun test test/secrets/

  # Fast, scanner-free guard: the docs compat matrix must match scanner-floors.json.
  docs-sync:
    name: Docs in sync with floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run docs:floors:check

  # Guards the "gitleaks is the fastest, hence recommended" claim in the docs.
  # Installs all four scanners (latest resolved version of each) and asserts the
  # ordering only — absolute timings are too noisy on shared runners to publish,
  # but the ordering survives the noise (see scripts/scanner-ordering-check.ts).
  ordering:
    name: Recommendation (gitleaks fastest)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install scanners (latest resolved)
        env:
          GL: ${{ fromJSON(needs.setup.outputs.gitleaks)[0] }}
          BL: ${{ fromJSON(needs.setup.outputs.betterleaks)[0] }}
          TH: ${{ fromJSON(needs.setup.outputs.trufflehog)[0] }}
          DS: ${{ fromJSON(needs.setup.outputs.detect_secrets)[0] }}
        run: |
          set -euo pipefail
          curl -fsSL -o gl.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GL}/gitleaks_${GL}_linux_x64.tar.gz"
          tar xzf gl.tar.gz gitleaks && sudo install gitleaks /usr/local/bin/gitleaks
          curl -fsSL -o bl.tar.gz "https://github.com/betterleaks/betterleaks/releases/download/v${BL}/betterleaks_${BL}_linux_x64.tar.gz"
          tar xzf bl.tar.gz betterleaks && sudo install betterleaks /usr/local/bin/betterleaks
          curl -fsSL -o th.tar.gz "https://github.com/trufflesecurity/trufflehog/releases/download/v${TH}/trufflehog_${TH}_linux_amd64.tar.gz"
          tar xzf th.tar.gz trufflehog && sudo install trufflehog /usr/local/bin/trufflehog
          pipx install "detect-secrets==${DS}"
          gitleaks version && betterleaks version && trufflehog --version && detect-secrets --version
      - run: bun run bench:ordering
