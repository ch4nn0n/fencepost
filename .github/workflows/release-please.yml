name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Authenticate as a GitHub App rather than the default GITHUB_TOKEN, so the
      # release PR/commits trigger workflows (CI + PR-title) and the required
      # status checks actually run on it.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Maintains a "release PR" from Conventional Commits. Merging it bumps the
      # version (package.json + .claude-plugin/plugin.json), updates CHANGELOG.md,
      # tags the commit, and creates a GitHub release.
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}

      # release-please only refreshes its PR when release content changes, so
      # the branch drifts behind main (and its CI then runs stale workflow
      # files). Keep it current so merging is always one click. The app token
      # makes the update trigger the PR's checks. Every failure mode is benign
      # (no open PR, already current, conflict — rp force-pushes the branch on
      # the next releasable commit), so this never fails the job.
      - name: Keep the release PR up to date with main
        if: steps.rp.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --head release-please--branches--main--components--fencepost \
            --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "no open release PR"
          else
            gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/update-branch" \
              || echo "::notice::release PR #$PR not updated (already current or conflicting)"
          fi

  publish:
    name: Publish plugin artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Build exactly the released code, not whatever main has moved to.
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the bundle
        run: bun run build

      # Plugin installs clone the `dist` branch (marketplace.json pins its ref
      # there): each release adds one commit whose tree is the released source
      # plus the built dist/. main stays source-only. Each snapshot also gets an
      # immutable dist-vX.Y.Z tag so users can pin a version. The dist- prefix
      # is load-bearing: release-please parses it as a foreign component and
      # skips it; a bare vX.Y.Z tag off main would corrupt its next-release
      # changelog computation (googleapis/release-please#1263).
      - name: Publish the dist branch and dist-version tag
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          TREE=$(git write-tree)
          PARENT=$(git fetch --depth=1 origin dist && git rev-parse FETCH_HEAD || true)
          COMMIT=$(git commit-tree "$TREE" ${PARENT:+-p "$PARENT"} -m "build: fencepost $TAG")
          git push origin "$COMMIT:refs/heads/dist" "$COMMIT:refs/tags/dist-$TAG"

      - name: Package & upload plugin archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          PKG="fencepost-$TAG"
          mkdir "$PKG"
          cp -r .claude-plugin hooks skills presets dist README.md LICENSE "$PKG/"
          zip -r "$PKG.zip" "$PKG"
          gh release upload "$TAG" "$PKG.zip" --clobber

  # Check the release from a consumer's perspective: clone the dist branch the
  # way a plugin install does and assert everything publish promised is there.
  # Publish is idempotent, so recovery from a red verify is re-running the
  # workflow.
  verify:
    name: Verify published artifacts
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the dist branch like a plugin install
        run: git clone --depth 1 --branch dist "https://github.com/$GITHUB_REPOSITORY" install

      - name: Smoke test the installed bundle under Node
        working-directory: install
        run: |
          OUT=$(echo '{"tool_name":"Read","tool_input":{},"session_id":"verify","cwd":"/tmp","hook_event_name":"PreToolUse","tool_use_id":"x"}' \
            | node dist/index.js evaluate)
          echo "$OUT"
          echo "$OUT" | grep -q '"permissionDecision"'

      - name: Assert refs, version, and release asset match
        working-directory: install
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          TIP=$(git rev-parse HEAD)
          TAGSHA=$(git ls-remote origin "refs/tags/dist-$TAG" | cut -f1)
          [ "$TAGSHA" = "$TIP" ] || { echo "::error::dist-$TAG ($TAGSHA) != dist branch tip ($TIP)"; exit 1; }
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync(".claude-plugin/plugin.json","utf8")).version')
          [ "v$VERSION" = "$TAG" ] || { echo "::error::plugin.json version v$VERSION != release $TAG"; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep -qx "fencepost-$TAG.zip" \
            || { echo "::error::release asset fencepost-$TAG.zip missing"; exit 1; }

  # Docs publish per release so the site always describes an installable
  # version. Deliberately gated on verify: a broken publish never ships docs.
  docs:
    name: Publish docs site
    needs: [release-please, verify]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
