name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Authenticate as a GitHub App rather than the default GITHUB_TOKEN, so the
      # release PR/commits trigger workflows (CI + PR-title) and the required
      # status checks actually run on it.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Maintains a "release PR" from Conventional Commits. Merging it bumps the
      # version (package.json + .claude-plugin/plugin.json), updates CHANGELOG.md,
      # tags the commit, and creates a GitHub release.
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}

  publish:
    name: Publish plugin archive
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the bundle
        run: bun run build

      - name: Package & upload plugin archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          PKG="fencepost-$TAG"
          mkdir "$PKG"
          cp -r .claude-plugin hooks skills presets dist README.md LICENSE "$PKG/"
          zip -r "$PKG.zip" "$PKG"
          gh release upload "$TAG" "$PKG.zip" --clobber
