name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Same pin as the release workflow (.bun-version), so CI exercises
          # the exact toolchain that builds the shipped bundle.
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Run tests
        run: bun test

      - name: Build bundle
        run: bun run build

      - name: Smoke test under Node
        run: |
          echo '{"tool_name":"Read","tool_input":{},"session_id":"ci","cwd":"/tmp","hook_event_name":"PreToolUse","tool_use_id":"x"}' \
            | node dist/index.js evaluate

  opengrep:
    name: Opengrep
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload
      actions: read
    steps:
      - uses: actions/checkout@v6

      # opengrep-rules has no tagged releases (it's a rolling ruleset repo),
      # so this floats on main. Only the language packs relevant to this
      # codebase (TS/JS/bash) plus the cross-language `generic` pack.
      - name: Check out opengrep rules
        uses: actions/checkout@v6
        with:
          repository: opengrep/opengrep-rules
          path: opengrep-rules
          sparse-checkout: |
            typescript
            javascript
            bash
            generic

      - name: Install opengrep
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash
          echo "$HOME/.opengrep/cli/latest" >> "$GITHUB_PATH"

      - name: Opengrep scan
        run: |
          opengrep scan \
            --config opengrep-rules/typescript \
            --config opengrep-rules/javascript \
            --config opengrep-rules/bash \
            --config opengrep-rules/generic \
            --exclude docs \
            --sarif-output=opengrep-results.sarif \
            --json-output=opengrep-results.json \
            --no-error .

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: opengrep-results.sarif
          category: opengrep

      - name: Scanned-files summary
        if: always()
        run: |
          {
            echo "### Opengrep scanned files"
            if [ -f opengrep-results.json ]; then
              scanned=$(jq '(.paths.scanned // []) | length' opengrep-results.json)
              skipped=$(jq '(.paths.skipped // []) | length' opengrep-results.json)
              echo
              echo "$scanned files scanned, $skipped skipped."
              echo
              echo "<details><summary>Scanned files</summary>"
              echo
              jq -r '(.paths.scanned // [])[]' opengrep-results.json | sed 's/^/- /'
              echo
              echo "</details>"
            else
              echo
              echo "(scan did not produce opengrep-results.json)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  osv-scan:
    name: Dependency vulnerability scan
    needs: test
    permissions:
      contents: read
      security-events: write # SARIF upload
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      # Non-recursive: scans the root bun.lock only. docs/ is a separate
      # Docusaurus project, not part of fencepost itself, so it's excluded.
      scan-args: |-
        ./

  osv-summary:
    name: OSV scan summary
    needs: osv-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Set as an env var rather than interpolated into the script body,
      # so the (untrusted-shaped, potentially large) JSON never passes
      # through shell expansion.
      OSV_RESULTS: ${{ needs.osv-scan.outputs.results }}
    steps:
      - name: Scanned-files summary
        run: |
          echo "$OSV_RESULTS" > osv-results.json
          {
            echo "### osv-scanner scanned files"
            echo
            n=$(jq '(.results // []) | length' osv-results.json)
            echo "$n lockfile(s)/manifest(s) scanned:"
            echo
            jq -r '(.results // [])[] | "- \(.source.path) (\(.packages | length) packages)"' osv-results.json
          } >> "$GITHUB_STEP_SUMMARY"
